<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive, modern glassmorphism calculator with history tracking, theme toggles, and safe calculations.">
  <title>Premium Glassmorphic Calculator</title>
  
  <!-- Google Fonts - Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons for modern action glyphs -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dynamic Gradient Background Circles for Glassmorphism depth -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  
  <main class="calculator-container" id="calculator-app">
    <!-- Calculator Header with Theme and History Panel Toggle -->
    <header class="calc-header">
      <div class="logo">
        <i class="fa-solid fa-calculator logo-icon"></i>
        <span>CALC<span class="accent-text">.io</span></span>
      </div>
      <div class="header-controls">
        <button id="theme-toggle" class="control-btn" aria-label="Toggle theme" title="Toggle Theme">
          <i class="fa-solid fa-moon theme-icon-dark"></i>
          <i class="fa-solid fa-sun theme-icon-light"></i>
        </button>
        <button id="history-toggle" class="control-btn" aria-label="Toggle history panel" title="View History">
          <i class="fa-solid fa-clock-rotate-left"></i>
        </button>
      </div>
    </header>

    <!-- Calculator Display Screen -->
    <section class="calc-display" aria-label="Calculator display screen">
      <div class="display-history" id="display-history" aria-live="polite"></div>
      <div class="display-main" id="display-main" aria-live="polite">0</div>
    </section>

    <!-- Calculator Keypad -->
    <section class="calc-keypad" id="keypad" aria-label="Calculator keypad">
      <!-- Row 1: Actions -->
      <button class="key btn-action btn-clear span-2" data-type="clear" data-key="Escape" aria-label="Clear all">C</button>
      <button class="key btn-action" data-type="backspace" data-key="Backspace" aria-label="Delete last digit"><i class="fa-solid fa-delete-left"></i></button>
      <button class="key btn-operator" data-type="operator" data-val="/" data-key="/" aria-label="Divide">÷</button>
      
      <!-- Row 2: Numbers & Operator -->
      <button class="key btn-number" data-type="number" data-val="7" data-key="7">7</button>
      <button class="key btn-number" data-type="number" data-val="8" data-key="8">8</button>
      <button class="key btn-number" data-type="number" data-val="9" data-key="9">9</button>
      <button class="key btn-operator" data-type="operator" data-val="*" data-key="*" aria-label="Multiply">×</button>
      
      <!-- Row 3: Numbers & Operator -->
      <button class="key btn-number" data-type="number" data-val="4" data-key="4">4</button>
      <button class="key btn-number" data-type="number" data-val="5" data-key="5">5</button>
      <button class="key btn-number" data-type="number" data-val="6" data-key="6">6</button>
      <button class="key btn-operator" data-type="operator" data-val="-" data-key="-">−</button>
      
      <!-- Row 4: Numbers & Operator -->
      <button class="key btn-number" data-type="number" data-val="1" data-key="1">1</button>
      <button class="key btn-number" data-type="number" data-val="2" data-key="2">2</button>
      <button class="key btn-number" data-type="number" data-val="3" data-key="3">3</button>
      <button class="key btn-operator" data-type="operator" data-val="+" data-key="+">+</button>
      
      <!-- Row 5: Decimals, Equal -->
      <button class="key btn-number span-2" data-type="number" data-val="0" data-key="0">0</button>
      <button class="key btn-number" data-type="decimal" data-val="." data-key=".">.</button>
      <button class="key btn-equal" data-type="equals" data-key="Enter" aria-label="Equals">=</button>
    </section>

    <!-- Persistable Side Drawer for Calculation History -->
    <aside class="history-sidebar" id="history-sidebar">
      <div class="sidebar-header">
        <h3>History</h3>
        <button id="clear-history" class="control-btn small-btn" title="Clear History" aria-label="Clear history">
          <i class="fa-regular fa-trash-can"></i>
        </button>
      </div>
      <div class="history-list" id="history-list">
        <div class="empty-history-msg">No calculations yet</div>
      </div>
    </aside>
  </main>

  <footer class="footer-note">
    Press <kbd class="keyboard-badge">Esc</kbd> for Clear, <kbd class="keyboard-badge">Back</kbd> for Backspace, <kbd class="keyboard-badge">Enter</kbd> for Equal. Supports full keyboard number pad.
  </footer>

  <!-- Core Javascript Logic -->
  <script src="script.js"></script>
</body>
</html>
